<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const ECO = ${ecoJson};
const TIERS = ${tiersJson};

let cookiesTotal = 0;
let pendingCookies = 0;
let cookieFlushTimer = null;

function switchTab(id, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
}

function openBot(url) {
  if (tg && typeof tg.openTelegramLink === 'function' && url.indexOf('https://t.me/') === 0) {
    tg.openTelegramLink(url);
  } else {
    window.location.href = url;
  }
}

function renderLists() {
  const ecoList = document.getElementById('eco-list');
  ecoList.innerHTML = ECO.filter(e => !e.isWebApp).map(e =>
    '<div class="eco-item">' +
      '<div><div class="eco-tag">' + e.tag + '</div><div class="eco-name">' + e.name + '</div><div class="eco-desc">' + e.short + '</div></div>' +
      '<button class="eco-go" onclick="openBot(\\'' + e.url + '\\')">Открыть</button>' +
    '</div>'
  ).join('');

  const tiersList = document.getElementById('tiers-list');
  tiersList.innerHTML = TIERS.map(t =>
    '<div class="tier-card ' + (t.stars >= 10000 ? 'legend' : '') + '">' +
      '<div class="tier-head"><span class="tier-name">' + t.title + '</span><span class="tier-stars">' + t.stars + ' ⭐</span></div>' +
      '<div class="tier-desc">' + t.desc + '</div>' +
      '<button class="btn ' + (t.stars >= 10000 ? 'btn-gold' : 'btn-lime') + '" onclick="buyTier(\\'' + t.id + '\\')">' + t.label + '</button>' +
    '</div>'
  ).join('');
}

async function loadState() {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();
    cookiesTotal = data.cookies || 0;
    document.getElementById('cookie-count').textContent = cookiesTotal;
    document.getElementById('news-body').textContent = (data.news && data.news.text) ? data.news.text : 'Эфир пуст. Жми «Новый эфир»!';
  } catch (e) {
    document.getElementById('news-body').textContent = 'Не удалось загрузить эфир.';
  }
}

document.getElementById('btn-gen-news').onclick = async () => {
  const msg = document.getElementById('feed-msg');
  msg.textContent = 'Генерируем свежий выпуск...';
  try {
    const res = await fetch('/api/generate', { method: 'POST' });
    const data = await res.json();
    if (data.ok && data.item) {
      document.getElementById('news-body').textContent = data.item.text;
      msg.textContent = 'Готово (' + data.item.provider + ')';
    } else {
      msg.textContent = data.error || 'Ошибка генерации';
    }
  } catch {
    msg.textContent = 'Сбой сети';
  }
};

document.getElementById('btn-speak').onclick = () => {
  const txt = document.getElementById('news-body').textContent;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'ru-RU';
  u.rate = 1.03;
  u.pitch = 0.85;
  window.speechSynthesis.speak(u);
};

document.getElementById('btn-tap-cookie').onclick = () => {
  cookiesTotal += 1;
  pendingCookies += 1;
  document.getElementById('cookie-count').textContent = cookiesTotal;
  if (cookieFlushTimer) clearTimeout(cookieFlushTimer);
  cookieFlushTimer = setTimeout(async () => {
    const delta = pendingCookies;
    pendingCookies = 0;
    if (delta <= 0) return;
    try {
      const r = await fetch('/api/free-cookie', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ delta }),
      });
      const d = await r.json();
      if (typeof d.cookies === 'number') {
        cookiesTotal = d.cookies;
        document.getElementById('cookie-count').textContent = cookiesTotal;
      }
    } catch {}
  }, 2000);
};

async function buyTier(tierId) {
  const msg = document.getElementById('pay-msg');
  msg.textContent = 'Создаём счёт Stars...';
  try {
    const res = await fetch('/api/create-invoice?tier=' + encodeURIComponent(tierId), { method: 'POST' });
    const data = await res.json();
    if (data.ok && data.url) {
      msg.textContent = '';
      if (tg && typeof tg.openInvoice === 'function') {
        tg.openInvoice(data.url, (status) => {
          msg.textContent = status === 'paid' ? '⭐ Оплата прошла, респект!' : ('Статус: ' + status);
        });
      } else {
        window.location.href = data.url;
      }
    } else {
      msg.textContent = data.error || 'Не удалось создать счёт';
    }
  } catch {
    msg.textContent = 'Ошибка соединения';
  }
}

// Web Audio DJ Console
let actx = null;
const padState = { bass: false, beat: false, synth: false };
let loopTimer = null;
let step = 0;

function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}

function playKick(t) {
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.frequency.setValueAtTime(140, t);
  osc.frequency.exponentialRampToValueAtTime(42, t + 0.14);
  g.gain.setValueAtTime(0.65, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t); osc.stop(t + 0.17);
}

function playBass(t, freq) {
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t); osc.stop(t + 0.23);
}

function playAcid(t, freq) {
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.09, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t); osc.stop(t + 0.14);
}

function tickEngine() {
  if (!padState.bass && !padState.beat && !padState.synth) {
    clearInterval(loopTimer); loopTimer = null;
    document.getElementById('dj-status').textContent = 'ЭФИР ГОТОВ';
    return;
  }
  document.getElementById('dj-status').textContent = 'DJ LIVE • 92 BPM';
  const t = actx.currentTime + 0.02;
  if (padState.beat && (step % 4 === 0 || step % 8 === 6)) playKick(t);
  if (padState.bass && step % 2 === 0) playBass(t, step % 4 === 0 ? 55 : 65.4);
  if (padState.synth) {
    const notes = [220, 261.6, 329.6, 293.6, 220, 392, 329.6, 261.6];
    playAcid(t, notes[step % notes.length]);
  }
  step = (step + 1) % 16;
}

function togglePad(name) {
  ensureAudio();
  padState[name] = !padState[name];
  document.getElementById('pad-' + name).classList.toggle('on', padState[name]);
  if (!loopTimer && (padState.bass || padState.beat || padState.synth)) {
    loopTimer = setInterval(tickEngine, 163);
  }
}

function triggerScratch() {
  ensureAudio();
  const t = actx.currentTime;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(900, t);
  osc.frequency.exponentialRampToValueAtTime(140, t + 0.12);
  osc.frequency.exponentialRampToValueAtTime(620, t + 0.22);
  g.gain.setValueAtTime(0.28, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t); osc.stop(t + 0.25);
}

renderLists();
loadState();
</script>
</body>
</html>`;
}

// ---------- Diagnostics & Setup ----------

async function handleDebug(env) {
  const me = await tgCall(env, 'getMe');
  const webhookInfo = await tgCall(env, 'getWebhookInfo');

  let availableModels = [];
  let geminiTest = 'GEMINI_API_KEY missing';

  if (env.GEMINI_API_KEY) {
    try {
      const mRes = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(env.GEMINI_API_KEY)}`,
      );
      if (mRes.ok) {
        const mJson = await mRes.json();
        availableModels = (mJson.models || [])
          .map((m) => String(m.name || '').replace(/^models\//, ''))
          .filter(Boolean);
      }
    } catch {}

    const gRes = await callGeminiChat(env, {
      systemInstruction: 'Reply with OK and 3 short words in Russian.',
      contents: [{ role: 'user', parts: [{ text: 'Тест связи' }] }],
    });
    geminiTest = gRes.ok ? `OK (${gRes.model}): ${gRes.text}` : `ERROR: ${gRes.errors.join(' | ')}`;
  }

  const waRes = await callWorkersAiChat(env, {
    systemInstruction: 'Reply with OK in 3 words in Russian.',
    messages: [{ role: 'user', content: 'Тест связи' }],
  });
  const workersAiTest = waRes.ok ? `OK (${waRes.model}): ${waRes.text}` : `ERROR: ${waRes.error}`;

  const canRead = me?.result?.can_read_all_group_messages;
  const privacyWarning = canRead === false
    ? 'В @BotFather включена Group Privacy (can_read_all_group_messages: false)! Отключи: @BotFather -> /mybots -> @zombie_rap_news_bot -> Bot Settings -> Group Privacy -> Turn off, затем передобавь бота в группу.'
    : null;

  return jsonResp({
    ok: true,
    version: 'V7',
    privacyWarning,
    bot: me?.result || me,
    webhookInfo: webhookInfo?.result || webhookInfo,
    geminiTest,
    workersAiTest,
    availableModels,
    ramChatsCount: RAM_CHATS.size,
    recentTrace: RAM_TRACE,
  });
}

async function handleSetup(env, reqUrl) {
  const webhookUrl = `${reqUrl.origin}/webhook`;
  const wh = await tgCall(env, 'setWebhook', {
    url: webhookUrl,
    allowed_updates: ['message', 'callback_query', 'pre_checkout_query'],
  });
  const cmds = await tgCall(env, 'setMyCommands', {
    commands: [
      { command: 'start', description: 'Запуск радио и меню' },
      { command: 'news', description: 'Свежий сатирический выпуск' },
      { command: 'games', description: 'Все 7 ботов и игры тусовки' },
      { command: 'banquet', description: 'Накрыть диджеям банкет (Stars)' },
      { command: 'ping', description: 'Проверка связи (/ping ai для ИИ)' },
    ],
  });
  const me = await tgCall(env, 'getMe');
  const canReadAllGroupMessages = me?.result?.can_read_all_group_messages ?? null;

  return jsonResp({
    ok: Boolean(wh?.ok),
    version: 'V7',
    webhookUrl,
    webhookSet: wh,
    commandsSet: cmds,
    canReadAllGroupMessages,
    warning: canReadAllGroupMessages === false
      ? 'Отключи Group Privacy в @BotFather -> Bot Settings -> Group Privacy -> Turn off!'
      : null,
  });
}

// ---------- Worker Entrypoint ----------

export default {
  async fetch(request, env, ctx) {
    if (request.method === 'OPTIONS') {
      return new Response(null, { status: 204, headers: getCorsHeaders() });
    }

    const url = new URL(request.url);
    const path = url.pathname;

    if (path === '/' || path === '/index.html') {
      return new Response(renderHtml(env), {
        headers: { 'Content-Type': 'text/html; charset=utf-8' },
      });
    }

    if (path === '/webhook' && request.method === 'POST') {
      const update = await request.json().catch(() => null);
      if (update) {
        ctx.waitUntil(handleTelegramUpdate(env, update));
      }
      return jsonResp({ ok: true });
    }

    if (path === '/setup') {
      return handleSetup(env, url);
    }

    if (path === '/debug') {
      return handleDebug(env);
    }

    if (path === '/api/state') {
      const news = await kvGetJson(env, 'latest_news', null);
      const cookies = (await kvGetJson(env, 'free_cookies', 0)) || 0;
      return jsonResp({ ok: true, news, cookies, ecosystem: getEcosystem(env), tiers: STAR_TIERS });
    }

    if (path === '/api/generate' && (request.method === 'POST' || request.method === 'GET')) {
      const topic = url.searchParams.get('topic') || '';
      const res = await generateAndStoreNews(env, { postToChannel: false, forceTopic: topic });
      return jsonResp(res, res.ok ? 200 : 502);
    }

    if (path === '/api/free-cookie' && request.method === 'POST') {
      const body = await request.json().catch(() => ({}));
      const delta = Math.max(1, Math.min(50, Number(body.delta) || 1));
      const cur = (await kvGetJson(env, 'free_cookies', 0)) || 0;
      const next = cur + delta;
      await kvPutJson(env, 'free_cookies', next);
      return jsonResp({ ok: true, cookies: next });
    }

    if (path === '/api/create-invoice') {
      const tier = url.searchParams.get('tier') || 'cookie';
      const link = await createStarInvoiceLink(env, tier);
      if (link.ok && link.result) {
        return jsonResp({ ok: true, url: link.result });
      }
      return jsonResp({ ok: false, error: link.description || 'Invoice error' }, 500);
    }

    return jsonResp({ ok: false, error: 'Not found' }, 404);
  },

  async scheduled(event, env, ctx) {
    ctx.waitUntil(generateAndStoreNews(env, { postToChannel: true }));
  },
};
