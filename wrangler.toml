// ---------- News Generation ----------

async function generateAndStoreNews(env, { postToChannel = false, forceTopic = '' } = {}) {
  const eco = getEcosystem(env).filter((e) => !e.isWebApp).map((e) => `${e.name} (${e.tag})`).join(', ');
  const sys = [
    'Ты главный редактор сатирического рэп-радио Zombie News.',
    'Напиши один короткий, острый, смешной выпуск ночных новостей в стиле радиопередачи от Zombie-DJ и Дяди Коли Мертвеца.',
    'Формат: 1 цепляющий заголовок с эмодзи + 3–4 предложения ироничной сводки про крипто-рынок, нейросети, уличный вайб или ночную жизнь, и в конце 1 короткий призыв проверить удачу.',
    `Можешь упомянуть один проект из тусовки: ${eco}.`,
  ].join('\n');

  const prompt = forceTopic
    ? `Сделай срочный выпуск про: ${forceTopic}`
    : `Сделай свежий выпуск эфира на ${new Date().toUTCString()}`;

  const aiRes = await callChatAIWithBackup(env, { systemInstruction: sys, history: [], userPrompt: prompt });
  if (!aiRes.ok) {
    return { ok: false, error: aiRes.errors.join(' | ') };
  }

  const item = {
    id: `news_${Date.now()}`,
    text: aiRes.text,
    provider: aiRes.provider,
    model: aiRes.model,
    createdAt: new Date().toISOString(),
  };

  const prev = await kvGetJson(env, 'news_history', []);
  const next = [item, ...(Array.isArray(prev) ? prev : [])].slice(0, 12);
  await kvPutJson(env, 'latest_news', item);
  await kvPutJson(env, 'news_history', next);

  if (postToChannel && env.TELEGRAM_CHAT_ID) {
    await sendTgMessage(env, env.TELEGRAM_CHAT_ID, `🎙 <b>ZOMBIE NEWS ЭФИР</b>\n\n${escapeHtml(item.text)}`, {
      parse_mode: 'HTML',
      reply_markup: buildCtaMarkup(env, item.text, true),
    });
  }

  return { ok: true, item };
}

// ---------- Message Handlers ----------

function extractDisplayName(msg) {
  if (msg.sender_chat && msg.sender_chat.title) {
    return msg.sender_chat.title;
  }
  const f = msg.from || {};
  if (f.id === 1087968824) return 'Анонимный Админ';
  return [f.first_name, f.last_name].filter(Boolean).join(' ') || f.username || 'Слушатель';
}

function shouldBotReplyInGroup(msg, mem) {
  const text = (msg.text || msg.caption || '').trim();
  if (!text) return { reply: false, direct: false };

  const lower = text.toLowerCase();
  const isReplyToBot = msg.reply_to_message?.from?.username?.toLowerCase() === BOT_USERNAME.toLowerCase();
  const hasMention = lower.includes(`@${BOT_USERNAME.toLowerCase()}`);
  const hasNameTrigger = hasCyrillicTrigger(
    lower,
    'зомби|дядя коля|колян|диджей|dj|бот|радио|новости|сыграем|картишки|карты|дурака|слоты|удача|вегас|хутор|банкет|печеньк',
  );
  const isQuestion = text.includes('?') && text.length >= 8;

  if (isReplyToBot || hasMention || hasNameTrigger) {
    return { reply: true, direct: true };
  }

  const sinceReplyMs = Date.now() - (mem.lastBotReplyTs || 0);
  if ((mem.turnsSinceReply >= 3 && sinceReplyMs > 25_000) || (isQuestion && sinceReplyMs > 45_000)) {
    return { reply: true, direct: false };
  }

  return { reply: false, direct: false };
}

