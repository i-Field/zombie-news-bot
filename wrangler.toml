  const chatId = msg.chat.id;
  const cmd = text.split(/\s+/)[0].toLowerCase().replace(`@${BOT_USERNAME}`, '');

  if (cmd === '/start') {
    const isPrivate = msg.chat.type === 'private';
    const welcome = [
      '📻 <b>Здарова, на связи Zombie Rap Radio!</b>',
      'Тут за пультом <b>Zombie-DJ</b> и <b>Дядя Коля Мертвец</b>.',
      '',
      'Можешь просто болтать со мной текстом — отвечу в тему, подкину новости, предложу партию в Дурака или слоты.',
      isPrivate ? 'Жми кнопку ниже, чтобы открыть пульт и все 7 ботов:' : 'Открой радио-пульт или выбери игру:',
    ].join('\n');
    await sendTgMessage(env, chatId, welcome, {
      parse_mode: 'HTML',
      reply_markup: buildAllGamesMarkup(env),
    });
    return true;
  }

  if (cmd === '/games' || cmd === '/bots') {
    const eco = getEcosystem(env).filter((e) => !e.isWebApp);
    const lines = eco.map((e) => `• <b>${escapeHtml(e.name)}</b> [${e.tag}] — ${escapeHtml(e.short)}`);
    await sendTgMessage(env, chatId, `🎮 <b>Вся тусовка проектов iField & Zombie:</b>\n\n${lines.join('\n')}`, {
      parse_mode: 'HTML',
      reply_markup: buildAllGamesMarkup(env),
    });
    return true;
  }

  if (cmd === '/banquet' || cmd === '/donate' || cmd === '/stars') {
    await sendTgMessage(
      env,
      chatId,
      '🤩 <b>Звёздный банкет и донаты в студию!</b>\nВыбери угощение для Zombie-DJ и Дяди Коли:',
      { parse_mode: 'HTML', reply_markup: buildBanquetMarkup() },
    );
    return true;
  }

  if (cmd === '/news') {
    await sendTyping(env, chatId);
    const cached = await kvGetJson(env, 'latest_news', null);
    if (cached && cached.text) {
      await sendTgMessage(env, chatId, `🎙 <b>Свежий выпуск:</b>\n\n${escapeHtml(cached.text)}`, {
        parse_mode: 'HTML',
        reply_markup: buildCtaMarkup(env, cached.text, true),
      });
    } else {
      const gen = await generateAndStoreNews(env, { postToChannel: false });
      if (gen.ok) {
        await sendTgMessage(env, chatId, `🎙 <b>Срочный выпуск:</b>\n\n${escapeHtml(gen.item.text)}`, {
          parse_mode: 'HTML',
          reply_markup: buildCtaMarkup(env, gen.item.text, true),
        });
      } else {
        await sendTgMessage(env, chatId, `⚠️ Радиовышка перегружена: ${gen.error}`);
      }
    }
    return true;
  }

  if (cmd === '/ping') {
    const wantAi = /\bai\b/i.test(text);
    const mem = RAM_CHATS.get(String(chatId));
    if (!wantAi) {
      await sendTgMessage(
        env,
        chatId,
        `🟢 Worker жив (V7). RAM-чатов: ${RAM_CHATS.size}. Истории в этом чате: ${mem ? mem.history.length : 0}. Напиши /ping ai для проверки ИИ.`,
      );
      return true;
    }

    await sendTyping(env, chatId);
    const t0 = Date.now();
    const aiRes = await callChatAIWithBackup(env, {
      systemInstruction: 'Ответь одной короткой бодрой фразой на русском, что связь с радиорубкой отличная.',
      history: [],
      userPrompt: 'Проверка связи /ping ai',
    });
    const ms = Date.now() - t0;
    if (aiRes.ok) {
      await sendTgMessage(
        env,
        chatId,
        `🟢 AI ответ за ${ms} мс\nПровайдер: ${aiRes.provider} (${aiRes.model})\n\n${aiRes.text}`,
      );
    } else {
      await sendTgMessage(env, chatId, `🔴 Ошибка AI (${ms} мс):\n${aiRes.errors.join('\n')}`);
    }
    return true;
  }

  return false;
}

async function handlePrivateMessage(env, msg) {
  const chatId = msg.chat.id;
  const text = (msg.text || msg.caption || '').trim();
  if (!text) return;

  if (text.startsWith('/')) {
    const handled = await handleCommands(env, msg, text);
    if (handled) return;
  }

  const name = extractDisplayName(msg);
  const mem = await getChatMem(env, chatId);
  pushChatHistory(mem, 'user', name, text);

  await sendTyping(env, chatId);
  const aiRes = await callChatAIWithBackup(env, {
    systemInstruction: getPersonaPrompt(false),
    history: mem.history.slice(0, -1),
    userPrompt: `${name}: ${text}`,
  });

  if (!aiRes.ok) {
    addTrace('dm_ai_err', aiRes.errors.join(' | ').slice(0, 220));
    await sendTgMessage(env, chatId, '📡 Сигнал до ИИ-пульта временно просел. Попробуй через пару секунд или жми /games!');
    return;
  }

  pushChatHistory(mem, 'assistant', 'Zombie-DJ', aiRes.text);
  mem.lastBotReplyTs = Date.now();
  mem.turnsSinceReply = 0;
  await flushChatMem(env, chatId, mem);

  await sendTgMessage(env, chatId, aiRes.text, {
    reply_markup: buildCtaMarkup(env, `${text} ${aiRes.text}`, true),
  });
}

async function handleGroupMessage(env, msg) {
  const chatId = msg.chat.id;
  const text = (msg.text || msg.caption || '').trim();

  if (Array.isArray(msg.new_chat_members) && msg.new_chat_members.length > 0) {
    const newcomers = msg.new_chat_members
      .filter((u) => !u.is_bot)
      .map((u) => u.first_name || u.username || 'боец');
    if (newcomers.length > 0) {
      const names = newcomers.join(', ');
      await sendTgMessage(
        env,
        chatId,
        `🧟‍♂️ В эфир залетел(и): <b>${escapeHtml(names)}</b>!\nДядя Коля уже тасует карты, а Zombie-DJ крутит биты. С чего начнём — срубнём в Дурака, покрутим слоты или включим радио?`,
        { parse_mode: 'HTML', reply_markup: buildAllGamesMarkup(env) },
      );
    }
    return;
  }

  if (!text) return;

  if (text.startsWith('/')) {
    const handled = await handleCommands(env, msg, text);
    if (handled) return;
  }

  const name = extractDisplayName(msg);
  const mem = await getChatMem(env, chatId);
  pushChatHistory(mem, 'user', name, text);
  mem.turnsSinceReply = (mem.turnsSinceReply || 0) + 1;

  const decision = shouldBotReplyInGroup(msg, mem);
  if (!decision.reply) return;

  await sendTyping(env, chatId);
  const aiRes = await callChatAIWithBackup(env, {
    systemInstruction: getPersonaPrompt(true, msg.chat.title || ''),
    history: mem.history.slice(0, -1),
    userPrompt: `${name}: ${text}`,
  });

  if (!aiRes.ok) {
    addTrace('group_ai_err', aiRes.errors.join(' | ').slice(0, 220));
    if (decision.direct) {
      await sendTgMessage(
        env,
        chatId,
        '🎙 Радиовышка чуть перегрелась — повтори через 10 секунд или жми /games!',
        { reply_to_message_id: msg.message_id },
      );
    }
    return;
  }

  pushChatHistory(mem, 'assistant', 'Zombie-DJ', aiRes.text);
  mem.lastBotReplyTs = Date.now();
  mem.turnsSinceReply = 0;
  await flushChatMem(env, chatId, mem);

  await sendTgMessage(env, chatId, aiRes.text, {
    reply_to_message_id: msg.message_id,
    reply_markup: buildCtaMarkup(env, `${text} ${aiRes.text}`, false),
  });
}

// ---------- Telegram Payments (Stars) ----------

async function sendStarInvoiceToChat(env, chatId, tierId) {
  const tier = STAR_TIERS.find((t) => t.id === tierId) || STAR_TIERS[0];
  return tgCall(env, 'sendInvoice', {
    chat_id: chatId,
    title: tier.title,
    description: tier.desc,
    payload: `star_tier:${tier.id}:${Date.now()}`,
    currency: 'XTR',
    prices: [{ label: tier.title, amount: tier.stars }],
  });
}

async function createStarInvoiceLink(env, tierId) {
  const tier = STAR_TIERS.find((t) => t.id === tierId) || STAR_TIERS[0];
  return tgCall(env, 'createInvoiceLink', {
    title: tier.title,
    description: tier.desc,
    payload: `star_tier:${tier.id}:${Date.now()}`,
    currency: 'XTR',
    prices: [{ label: tier.title, amount: tier.stars }],
  });
}

async function handleCallbackQuery(env, cq) {
  const data = cq.data || '';
  const chatId = cq.message?.chat?.id;
  await tgCall(env, 'answerCallbackQuery', { callback_query_id: cq.id }).catch(() => null);

  if (!chatId) return;

  if (data === 'open_banquet') {
    await sendTgMessage(
      env,
      chatId,
      '🤩 <b>Меню банкета для Zombie-DJ и Дяди Коли:</b>',
      { parse_mode: 'HTML', reply_markup: buildBanquetMarkup() },
    );
    return;
  }

  if (data.startsWith('buy_')) {
    const tierId = data.slice(4);
    await sendStarInvoiceToChat(env, chatId, tierId);
  }
}

async function handleTelegramUpdate(env, update) {
  try {
    if (update.pre_checkout_query) {
      await tgCall(env, 'answerPreCheckoutQuery', {
        pre_checkout_query_id: update.pre_checkout_query.id,
        ok: true,
      });
      return;
    }

    if (update.callback_query) {
      addTrace('callback', update.callback_query.data || '');
      await handleCallbackQuery(env, update.callback_query);
      return;
    }

    const msg = update.message;
    if (!msg) return;

    if (msg.successful_payment) {
      const amount = msg.successful_payment.total_amount;
      const who = extractDisplayName(msg);
      const isBanquet = amount >= 10000;
      await sendTgMessage(
        env,
        msg.chat.id,
        isBanquet
          ? `👑 <b>${escapeHtml(who)}</b> НАКРЫЛ ДИДЖЕЯМ БАНКЕТ на ${amount} ⭐! Вся рубка и канал встают на уши — низкий поклон, легенда!`
          : `⭐ Спасибо, <b>${escapeHtml(who)}</b>! Долетело ${amount} ⭐ — Дядя Коля и Zombie-DJ заряжены на максимум!`,
        { parse_mode: 'HTML' },
      );
      if (env.ADMIN_CHAT_ID) {
        await sendTgMessage(env, env.ADMIN_CHAT_ID, `💰 Донат ${amount} ⭐ от ${who} (${msg.from?.id || '?'})`).catch(() => null);
      }
      return;
    }

    // Skip channel auto-forwards into discussion group to avoid bot replying to its own news mirrors
    if (msg.is_automatic_forward) return;

    const fromId = msg.from?.id;
    const isBotSender = Boolean(msg.from?.is_bot);
    if (isBotSender && !ALLOWED_BOT_SENDER_IDS.has(fromId)) {
      addTrace('ignored_bot', `${fromId}:${msg.from?.username || ''}`);
      return;
    }

    const chatType = msg.chat?.type;
    addTrace('msg', `${chatType}:${msg.chat?.id}:${fromId || 'anon'}:${(msg.text || '').slice(0, 40)}`);

    if (chatType === 'private') {
      await handlePrivateMessage(env, msg);
    } else if (chatType === 'group' || chatType === 'supergroup') {
      await handleGroupMessage(env, msg);
    }
  } catch (e) {
    addTrace('update_err', e.message);
  }
}

